<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>NeoX</title>
<style>
:root{--bg:#0f1115;--panel:#1a1d24;--panel-2:#232833;--text:#e8eaed;--muted:#9aa0a6;
--accent:#9b5cff;--border:#2e3440;--online:#31d158;--danger:#ef4444;
--own:linear-gradient(135deg,#9b5cff,#7c3aed);--neo-fill:#fff;--neo-stroke:#9b5cff;
--x-fill:#9b5cff;--x-stroke:#fff;--shadow:0 1px 2px rgba(0,0,0,.35)}
body[data-theme=light]{--bg:#eef1f5;--panel:#fff;--panel-2:#f7f8fa;--text:#111;
--muted:#6b7280;--accent:#7c3aed;--border:#e5e7eb;--online:#22c55e;--danger:#dc2626;
--neo-fill:#000;--neo-stroke:#9b5cff;--x-fill:#9b5cff;--x-stroke:#000;
--shadow:0 1px 2px rgba(0,0,0,.06)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
background:var(--bg);color:var(--text);transition:background .25s,color .25s;overscroll-behavior:none}
button,input,textarea{font-family:inherit}
.logo-svg{height:30px;width:auto;display:block}
.logo-svg text{font-family:'Arial Black',Arial,sans-serif;font-weight:900}
.neo-part{fill:var(--neo-fill);stroke:var(--neo-stroke);stroke-width:3;paint-order:stroke}
.x-part{fill:var(--x-fill);stroke:var(--x-stroke);stroke-width:3;paint-order:stroke}

/* ЭКРАН ВХОДА */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
padding:24px;background:var(--bg);z-index:100;
background-image:radial-gradient(circle at 30% 20%,rgba(155,92,255,.15),transparent 50%),
radial-gradient(circle at 70% 80%,rgba(155,92,255,.15),transparent 50%)}
.screen.hidden{display:none}
.auth-card{width:100%;max-width:420px;background:var(--panel);border-radius:20px;
padding:32px 24px;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--border)}
.auth-card .logo-svg{height:52px;margin:0 auto 20px}
.auth-card h1{font-size:22px;text-align:center;margin-bottom:6px}
.auth-card p{text-align:center;color:var(--muted);font-size:14px;margin-bottom:22px}
.auth-card input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--border);
background:var(--panel-2);color:var(--text);font-size:16px;outline:none;margin-bottom:12px}
.auth-card input:focus{border-color:var(--accent)}
.btn-primary{width:100%;padding:14px;border-radius:12px;border:none;background:var(--own);
color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.btn-primary:disabled{opacity:.5}
.auth-hint{margin-top:16px;font-size:12px;color:var(--muted);text-align:center;line-height:1.5}

/* ПРИЛОЖЕНИЕ */
.app{width:100%;height:100dvh;height:100vh;display:flex;position:relative;
overflow:hidden;max-width:1400px;margin:0 auto}
.app.hidden{display:none}
@media(min-width:820px){body{display:flex;align-items:center;justify-content:center;padding:18px}
.app{height:min(92vh,900px);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.35)}}
.sidebar{position:absolute;inset:0;background:var(--panel);display:flex;flex-direction:column;
z-index:2;transition:transform .3s cubic-bezier(.4,0,.2,1)}
.app.chat-open .sidebar{transform:translateX(-25%)}
@media(min-width:820px){.sidebar{position:relative;width:340px;flex-shrink:0;
border-right:1px solid var(--border)}.app.chat-open .sidebar{transform:none}}
.side-header{display:flex;align-items:center;gap:8px;padding:10px 12px;
padding-top:calc(10px + env(safe-area-inset-top));background:rgba(26,29,36,.85);
backdrop-filter:blur(20px);border-bottom:1px solid var(--border);z-index:5}
body[data-theme=light] .side-header{background:rgba(255,255,255,.88)}
.side-header .spacer{flex:1}
.me-info{display:flex;align-items:center;gap:8px;min-width:0}
.me-info .name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;
text-overflow:ellipsis;max-width:90px}
.icon-btn{width:36px;height:36px;border-radius:50%;border:none;background:transparent;
color:var(--text);font-size:17px;cursor:pointer;display:flex;align-items:center;
justify-content:center;transition:background .15s;flex-shrink:0}
.icon-btn:active{background:var(--border)}
.search{padding:8px 12px;background:var(--panel)}
.search input{width:100%;padding:9px 14px;border-radius:10px;border:none;
background:var(--panel-2);color:var(--text);font-size:14px;outline:none}
.contacts{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 0}
.section-title{padding:10px 16px 4px;font-size:11px;color:var(--muted);
text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.contact{display:flex;align-items:center;gap:12px;padding:9px 14px;cursor:pointer;
transition:background .15s;position:relative}
.contact:active,.contact.active{background:var(--panel-2)}
.avatar-wrap{position:relative;flex-shrink:0}
.avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;
justify-content:center;font-weight:700;color:#fff;font-size:18px;user-select:none}
.avatar.sm{width:36px;height:36px;font-size:14px}
.avatar.online::after{content:'';position:absolute;right:0;bottom:0;width:12px;
height:12px;border-radius:50%;background:var(--online);border:2.5px solid var(--panel)}
.contact-info{flex:1;min-width:0}
.contact-top{display:flex;align-items:baseline;gap:8px;margin-bottom:3px}
.contact-name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;
text-overflow:ellipsis;flex:1}
.contact-time{font-size:11px;color:var(--muted);flex-shrink:0}
.contact-bottom{display:flex;align-items:center;gap:8px}
.contact-preview{font-size:13.5px;color:var(--muted);flex:1;white-space:nowrap;
overflow:hidden;text-overflow:ellipsis}
.contact-preview.online{color:var(--online)}
.contact-preview.typing{color:var(--accent);font-style:italic}

/* ЧАТ */
.chat{position:absolute;inset:0;left:100%;background:var(--bg);display:flex;
flex-direction:column;z-index:3;transition:left .3s cubic-bezier(.4,0,.2,1)}
.app.chat-open .chat{left:0}
@media(min-width:820px){.chat{position:relative;inset:auto;left:0;flex:1;min-width:0}}
.chat-header{display:flex;align-items:center;gap:10px;padding:8px 10px;
padding-top:calc(8px + env(safe-area-inset-top));background:rgba(26,29,36,.85);
backdrop-filter:blur(20px);border-bottom:1px solid var(--border);z-index:5}
body[data-theme=light] .chat-header{background:rgba(255,255,255,.88)}
.back-btn{font-size:24px}
@media(min-width:820px){.back-btn{display:none}}
.chat-head-info{flex:1;min-width:0}
.chat-head-name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;
text-overflow:ellipsis}
.chat-head-status{font-size:12px;color:var(--muted);margin-top:1px}
.chat-head-status.online{color:var(--online)}
.chat-head-status.typing{color:var(--accent);font-style:italic}
.messages{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:14px 10px 8px;
display:flex;flex-direction:column;gap:4px}
.msg-row{display:flex;flex-direction:column;margin:2px 0;position:relative}
.msg-row.own{align-items:flex-end}
.msg-row.other{align-items:flex-start}
.msg{max-width:78%;padding:7px 11px 6px;border-radius:14px;line-height:1.35;
font-size:14.5px;word-break:break-word;animation:pop .18s ease-out;position:relative}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.msg.own{background:var(--own);color:#fff;border-bottom-right-radius:4px}
.msg.other{background:var(--panel-2);color:var(--text);border-bottom-left-radius:4px;
box-shadow:var(--shadow)}
.msg-author{font-size:12px;font-weight:700;margin-bottom:2px}
.msg-text{white-space:pre-wrap}
.msg-time{font-size:10.5px;opacity:.65;margin-left:6px;float:right;margin-top:3px}
.msg.own .msg-time::after{content:' ✓'}
.msg.own.read .msg-time::after{content:' ✓✓';color:#b6f5c9}
.msg.edited::before{content:'(изм.) ';font-size:10.5px;opacity:.6}
.msg-media{max-width:100%;border-radius:8px;margin-top:4px;display:block;cursor:pointer}
.msg-audio{width:220px;margin-top:4px}
.msg-file{display:flex;align-items:center;gap:8px;padding:8px 10px;
background:rgba(0,0,0,.15);border-radius:8px;margin-top:4px;text-decoration:none;
color:inherit}
.msg-file-icon{font-size:22px}
.msg-file-info{flex:1;min-width:0}
.msg-file-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;
text-overflow:ellipsis}
.msg-file-size{font-size:11px;opacity:.7}
.reply-quote{padding:5px 8px;border-left:3px solid var(--accent);
background:rgba(255,255,255,.08);border-radius:6px;margin-bottom:4px;font-size:12.5px;
line-height:1.3;cursor:pointer}
.msg.other .reply-quote{background:rgba(0,0,0,.08)}
.reply-quote .who{font-weight:700;color:var(--accent);display:block;margin-bottom:1px}
.reactions{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.reaction{padding:2px 7px;border-radius:10px;background:rgba(0,0,0,.2);font-size:12px;
cursor:pointer;border:1px solid transparent;user-select:none}
.reaction.mine{background:rgba(155,92,255,.35);border-color:var(--accent)}
.msg-actions{display:flex;gap:2px;position:absolute;top:-28px;background:var(--panel);
border-radius:8px;padding:3px;box-shadow:var(--shadow);border:1px solid var(--border);
z-index:5;opacity:0;transition:opacity .15s}
.msg-row.own .msg-actions{right:0}
.msg-row.other .msg-actions{left:0}
.msg:hover .msg-actions{opacity:1}
.msg-actions button{background:transparent;border:none;font-size:14px;width:28px;
height:28px;border-radius:6px;cursor:pointer;color:var(--text)}
.msg-actions button:active{background:var(--panel-2)}
.emoji-picker{position:absolute;background:var(--panel);border:1px solid var(--border);
border-radius:10px;padding:6px;display:flex;gap:2px;box-shadow:var(--shadow);z-index:200}
.emoji-picker button{background:transparent;border:none;font-size:18px;width:32px;
height:32px;border-radius:6px;cursor:pointer}
.typing-bubble{align-self:flex-start;display:inline-flex;gap:4px;padding:11px 14px;
background:var(--panel-2);border-radius:14px;border-bottom-left-radius:4px;
box-shadow:var(--shadow);margin:2px 0}
.typing-bubble span{width:7px;height:7px;border-radius:50%;background:var(--muted);
animation:blink 1.3s infinite both}
.typing-bubble span:nth-child(2){animation-delay:.18s}
.typing-bubble span:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
color:var(--muted);gap:12px;padding:20px;text-align:center}
.composer-wrap{border-top:1px solid var(--border);background:var(--panel)}
.reply-preview{padding:8px 12px;display:flex;align-items:center;gap:8px;
border-bottom:1px solid var(--border);font-size:13px;color:var(--muted)}
.reply-preview .txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reply-preview button{background:transparent;border:none;color:var(--muted);font-size:16px;
cursor:pointer;padding:4px 8px}
.composer{display:flex;gap:6px;padding:8px 10px;
padding-bottom:calc(8px + env(safe-area-inset-bottom));align-items:flex-end}
.composer input{flex:1;padding:11px 15px;border-radius:20px;border:none;
background:var(--panel-2);color:var(--text);font-size:15px;outline:none;min-width:0}
.composer-btn{width:42px;height:42px;border-radius:50%;border:none;background:var(--panel-2);
color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;
flex-shrink:0}
.composer-btn.rec{background:var(--danger);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.send-btn{width:42px;height:42px;border-radius:50%;border:none;background:var(--own);
color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
flex-shrink:0}
.send-btn:disabled{opacity:.4}
.send-btn svg{width:20px;height:20px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;
align-items:center;justify-content:center;padding:20px}
.modal{background:var(--panel);border-radius:16px;padding:20px;width:100%;max-width:360px;
border:1px solid var(--border)}
.modal h3{font-size:17px;margin-bottom:14px}
.modal textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);
background:var(--panel-2);color:var(--text);font-size:15px;outline:none;resize:vertical}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.modal-actions button{padding:9px 16px;border-radius:10px;border:none;font-size:14px;
font-weight:600;cursor:pointer}
.btn-cancel{background:var(--panel-2);color:var(--text)}
.btn-ok{background:var(--accent);color:#fff}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--panel);
color:var(--text);padding:10px 18px;border-radius:20px;border:1px solid var(--border);
box-shadow:var(--shadow);font-size:14px;z-index:300}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:250;display:flex;
align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.viewer img{max-width:100%;max-height:100%;border-radius:8px}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body data-theme="dark">

<div class="screen" id="authScreen">
  <div class="auth-card">
    <svg class="logo-svg" viewBox="0 0 240 80"><text x="0" y="62" class="neo-part" font-size="64">Neo</text><text x="130" y="62" class="x-part" font-size="64">X</text></svg>
    <h1>Добро пожаловать</h1>
    <p>Введите имя, чтобы начать общение</p>
    <input id="nickInput" type="text" maxlength="20" placeholder="Ваш ник" autocomplete="off">
    <button class="btn-primary" id="enterBtn" disabled>Войти в NeoX</button>
    <div class="auth-hint">Свой сервер. Полный контроль. Никаких Firebase.</div>
  </div>
</div>

<div class="app hidden" id="app">
  <aside class="sidebar">
    <div class="side-header">
      <svg class="logo-svg" viewBox="0 0 240 80"><text x="0" y="62" class="neo-part" font-size="64">Neo</text><text x="130" y="62" class="x-part" font-size="64">X</text></svg>
      <div class="spacer"></div>
      <div class="me-info">
        <div class="avatar sm" id="meAvatar"></div>
        <div class="name" id="meName"></div>
      </div>
      <button class="icon-btn" id="themeToggle" title="Тема">🌙</button>
      <button class="icon-btn" id="logoutBtn" title="Выйти">⎋</button>
    </div>
    <div class="search"><input id="searchInput" placeholder="Поиск"></div>
    <div class="contacts" id="contacts"></div>
  </aside>

  <section class="chat">
    <div class="empty" id="emptyState">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <div>Выберите чат слева,<br>чтобы начать общение</div>
    </div>

    <div class="chat-header" id="chatHeader" style="display:none">
      <button class="icon-btn back-btn" id="backBtn">‹</button>
      <div class="avatar-wrap"><div class="avatar sm" id="headAvatar"></div></div>
      <div class="chat-head-info">
        <div class="chat-head-name" id="headName"></div>
        <div class="chat-head-status" id="headStatus"></div>
      </div>
    </div>

    <div class="messages" id="messages" style="display:none"></div>

    <div class="composer-wrap" id="composerWrap" style="display:none">
      <div id="replyPreview"></div>
      <form class="composer" id="composer">
        <button type="button" class="composer-btn" id="fileBtn" title="Файл">📎</button>
        <button type="button" class="composer-btn" id="voiceBtn" title="Голосовое">🎙</button>
        <input id="messageInput" placeholder="Сообщение..." autocomplete="off">
        <button type="submit" class="send-btn" id="sendBtn" disabled>
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </form>
    </div>
    <input type="file" id="fileInput" style="display:none">
  </section>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
/* ============ ТЕМА ============ */
const body = document.body;
const themeToggle = document.getElementById('themeToggle');
function setTheme(t){ body.dataset.theme = t; localStorage.setItem('neox-theme', t);
  themeToggle.textContent = t === 'dark' ? '☀️' : '🌙';
  document.querySelector('meta[name=theme-color]').content = t==='dark'?'#0f1115':'#eef1f5'; }
setTheme(localStorage.getItem('neox-theme') || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
themeToggle.onclick = () => setTheme(body.dataset.theme==='dark'?'light':'dark');

/* ============ УТИЛИТЫ ============ */
const LS = { get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},
             set:(k,v)=>localStorage.setItem(k,JSON.stringify(v)),
             del:k=>localStorage.removeItem(k) };
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTime = ts => ts ? new Date(ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}) : '';
const fmtDate = ts => { if(!ts) return ''; const d=new Date(ts),n=new Date();
  if (d.toDateString()===n.toDateString()) return fmtTime(ts);
  if (new Date(n-864e5).toDateString()===d.toDateString()) return 'вчера';
  return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'}); };
const fmtSize = b => b<1024?b+' Б':b<1048576?(b/1024).toFixed(1)+' КБ':(b/1048576).toFixed(1)+' МБ';
const fmtLastSeen = ts => { if(!ts) return 'недавно'; const d=(Date.now()-ts)/1000;
  if(d<60) return 'только что'; if(d<3600) return Math.floor(d/60)+' мин назад';
  if(d<86400) return Math.floor(d/3600)+' ч назад'; return Math.floor(d/86400)+' дн назад'; };
const colorFromName = n => { const p=['#9b5cff','#22c55e','#ec4899','#06b6d4','#f59e0b','#ef4444','#3b82f6','#14b8a6','#8b5cf6','#f97316'];
  let h=0; for(let i=0;i<n.length;i++) h=(h*31+n.charCodeAt(i))|0; return p[Math.abs(h)%p.length]; };
const uid = () => 'u_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const showToast = msg => { const t=document.createElement('div'); t.className='toast';
  t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); };

/* ============ ВХОД ============ */
const authScreen = document.getElementById('authScreen');
const app = document.getElementById('app');
const nickInput = document.getElementById('nickInput');
const enterBtn = document.getElementById('enterBtn');
let me = LS.get('neox-me', null);
nickInput.value = me?.name || '';
const updBtn = () => enterBtn.disabled = nickInput.value.trim().length < 2;
nickInput.addEventListener('input', updBtn); updBtn();
nickInput.addEventListener('keydown', e => { if(e.key==='Enter'&&!enterBtn.disabled) enterBtn.click(); });

/* ============ SOCKET ============ */
const socket = io({ maxHttpBufferSize: 8e6 });
let state = { users: {}, messages: {} };
let currentChat = null;
let typingState = {};
let replyTo = null;
let lastMsgCache = {};
let searchQuery = '';
let typingTimer = null;
let lastTyping = false;

socket.on('connect', () => {
  if (me) socket.emit('hello', { uid: me.uid, name: me.name, color: me.color });
});
socket.on('connect_error', () => showToast('Нет соединения с сервером'));

socket.on('state', ({ users, messages }) => {
  state.users = {}; users.forEach(u => state.users[u.uid] = u);
  state.messages = messages || {};
  renderContacts();
  if (currentChat) { renderMessages(); renderHeader(); }
});

socket.on('userUpdate', ({ user }) => {
  if (!user || !user.uid) return;
  state.users[user.uid] = user;
  renderContacts();
  if (currentChat && currentChat === user.uid) renderHeader();
});

socket.on('message', ({ room, msg }) => {
  if (!state.messages[room]) state.messages[room] = [];
  state.messages[room].push(msg);
  if (room === chatKey(currentChat)) { renderMessages(); markAllRead(); }
  renderContacts();
});

socket.on('messageUpdate', ({ room, id, patch }) => {
  const arr = state.messages[room] || [];
  const i = arr.findIndex(m => m.id === id);
  if (i > -1) arr[i] = { ...arr[i], ...patch };
  if (room === chatKey(currentChat)) renderMessages();
  renderContacts();
});

socket.on('messageDelete', ({ room, id }) => {
  state.messages[room] = (state.messages[room] || []).filter(m => m.id !== id);
  if (room === chatKey(currentChat)) renderMessages();
  renderContacts();
});

socket.on('typing', ({ room, uid: u, isTyping }) => {
  if (!typingState[room]) typingState[room] = {};
  if (isTyping) typingState[room][u] = true; else delete typingState[room][u];
  if (room === chatKey(currentChat)) { renderMessages(); renderHeader(); }
  renderContacts();
});

/* ============ СТАРТ ============ */
enterBtn.addEventListener('click', () => {
  const name = nickInput.value.trim().slice(0,20);
  if (name.length < 2) return;
  const existing = LS.get('neox-me', null);
  me = existing && existing.name === name ? existing
       : { uid: uid(), name, color: colorFromName(name) };
  LS.set('neox-me', me);
  authScreen.classList.add('hidden');
  app.classList.remove('hidden');
  document.getElementById('meName').textContent = me.name;
  document.getElementById('meAvatar').textContent = me.name[0].toUpperCase();
  document.getElementById('meAvatar').style.background = me.color;
  socket.emit('hello', { uid: me.uid, name: me.name, color: me.color });
  renderContacts();
  if (window.innerWidth >= 820) openChat('general');
});

/* ============ ЧАТЫ ============ */
function dmKey(other) { return [me.uid, other].sort().join('__'); }
function chatKey(id) { return id === 'general' ? 'general' : dmKey(id); }

const contactsEl = document.getElementById('contacts');
const messagesEl = document.getElementById('messages');
const chatHeader = document.getElementById('chatHeader');
const composerWrap = document.getElementById('composerWrap');
const emptyState = document.getElementById('emptyState');
const headName = document.getElementById('headName');
const headStatus = document.getElementById('headStatus');
const headAvatar = document.getElementById('headAvatar');
const messageInput = document.getElementById('messageInput');
const sendBtn = document.getElementById('sendBtn');

function previewOf(m){
  if (m.type === 'voice') return '🎙 Голосовое';
  if (m.type === 'file'){
    if (m.fileType?.startsWith('image/')) return '🖼 Фото';
    return '📎 ' + (m.fileName || 'Файл');
  }
  return m.text || '';
}

function lastMessage(room){
  const arr = state.messages[room];
  return arr && arr.length ? arr[arr.length-1] : null;
}

function renderContacts(){
  const others = Object.values(state.users).filter(u => u.uid !== me.uid);
  const filtered = others.filter(u => u.name.toLowerCase().includes(searchQuery.toLowerCase()));
  const isOn = u => u.online;
  const online = filtered.filter(isOn);
  const offline = filtered.filter(u => !isOn(u));

  const gLast = lastMessage('general');
  const gHtml = `
    <div class="contact ${currentChat==='general'?'active':''}" data-chat="general">
      <div class="avatar-wrap"><div class="avatar" style="background:var(--own)">#</div></div>
      <div class="contact-info">
        <div class="contact-top">
          <div class="contact-name">Общий чат NeoX</div>
          <div class="contact-time">${gLast?fmtDate(gLast.time):''}</div>
        </div>
        <div class="contact-bottom">
          <div class="contact-preview">${gLast?esc((gLast.uid===me.uid?'Вы: ':gLast.name+': ')+previewOf(gLast)):'Добро пожаловать!'}</div>
        </div>
      </div>
    </div>`;

  const cHtml = u => {
    const key = dmKey(u.uid);
    const last = lastMessage(key);
    const isTyping = typingState[key] && Object.keys(typingState[key]).length > 0;
    let preview = last ? ((last.uid===me.uid?'Вы: ':'')+previewOf(last)) : 'Нет сообщений';
    let cls = 'contact-preview';
    if (isTyping) { preview='печатает…'; cls+=' typing'; }
    else if (!last && u.online) { preview='в сети'; cls+=' online'; }
    return `
      <div class="contact ${currentChat===u.uid?'active':''}" data-chat="${u.uid}">
        <div class="avatar-wrap">
          <div class="avatar ${u.online?'online':''}" style="background:${u.color}">${esc((u.name[0]||'?').toUpperCase())}</div>
        </div>
        <div class="contact-info">
          <div class="contact-top">
            <div class="contact-name">${esc(u.name)}</div>
            ${last?`<div class="contact-time">${fmtDate(last.time)}</div>`:''}
          </div>
          <div class="contact-bottom"><div class="${cls}">${esc(preview)}</div></div>
        </div>
      </div>`;
  };

  let html = `<div class="section-title">Чаты</div>${gHtml}`;
  if (online.length){ html += `<div class="section-title">В сети — ${online.length}</div>` + online.map(cHtml).join(''); }
  if (offline.length){ html += `<div class="section-title">Не в сети</div>` + offline.map(cHtml).join(''); }
  contactsEl.innerHTML = html;
}

contactsEl.addEventListener('click', e => {
  const el = e.target.closest('.contact');
  if (el) openChat(el.dataset.chat);
});
document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value; renderContacts();
});

/* ============ ОТКРЫТИЕ ============ */
function openChat(id){
  if (currentChat === id){ app.classList.add('chat-open'); return; }
  if (currentChat) socket.emit('typing', { room: chatKey(currentChat), isTyping: false });
  currentChat = id;
  chatHeader.style.display = 'flex';
  messagesEl.style.display = 'flex';
  composerWrap.style.display = 'block';
  emptyState.style.display = 'none';
  app.classList.add('chat-open');
  renderHeader();
  renderMessages();
  markAllRead();
  renderContacts();
  setTimeout(() => messageInput.focus(), 250);
}

function renderHeader(){
  if (!currentChat) return;
  if (currentChat === 'general'){
    headName.textContent = 'Общий чат NeoX';
    headAvatar.textContent = '#';
    headAvatar.style.background = 'var(--own)';
    headAvatar.classList.remove('online');
    const on = Object.values(state.users).filter(u => u.online).length;
    headStatus.textContent = on + ' в сети';
    headStatus.className = 'chat-head-status online';
    return;
  }
  const u = state.users[currentChat];
  if (!u) return;
  headName.textContent = u.name;
  headAvatar.textContent = (u.name[0]||'?').toUpperCase();
  headAvatar.style.background = u.color;
  headAvatar.classList.toggle('online', !!u.online);
  const key = chatKey(currentChat);
  const isTyping = typingState[key] && Object.keys(typingState[key]).length > 0;
  if (isTyping){ headStatus.textContent = 'печатает…'; headStatus.className = 'chat-head-status typing'; }
  else if (u.online){ headStatus.textContent = 'в сети'; headStatus.className = 'chat-head-status online'; }
  else { headStatus.textContent = 'был(а) ' + fmtLastSeen(u.lastSeen); headStatus.className = 'chat-head-status'; }
}

/* ============ СООБЩЕНИЯ ============ */
function renderMessages(){
  if (!currentChat) return;
  const key = chatKey(currentChat);
  const arr = state.messages[key] || [];
  const html = arr.map(m => renderMsg(m, currentChat==='general')).join('');
  const typingHtml = (typingState[key] && Object.keys(typingState[key]).length)
    ? '<div class="typing-bubble"><span></span><span></span><span></span></div>' : '';
  messagesEl.innerHTML = html + typingHtml;
  messagesEl.scrollTop = messagesEl.scrollHeight;

  messagesEl.querySelectorAll('.reaction').forEach(el => {
    el.onclick = e => { e.stopPropagation(); toggleReaction(el.dataset.id, el.dataset.emoji); };
  });
  messagesEl.querySelectorAll('.msg-actions button').forEach(btn => {
    btn.onclick = e => {
      e.stopPropagation();
      const id = btn.dataset.id, act = btn.dataset.act;
      if (act === 'reply') startReply(id);
      else if (act === 'emoji') showEmojiPicker(btn, id);
      else if (act === 'edit') editMessage(id);
      else if (act === 'delete') deleteMessage(id);
    };
  });
  messagesEl.querySelectorAll('img.msg-media').forEach(img => {
    img.onclick = () => openViewer(img.src);
  });
}

function renderMsg(m, showAuthor){
  const own = m.uid === me.uid;
  const read = own && m.readBy?.length > 1;
  let body = '';
  if (m.type === 'file'){
    if (m.fileType?.startsWith('image/')) body = `<img src="${m.data}" class="msg-media">`;
    else if (m.fileType?.startsWith('video/')) body = `<video src="${m.data}" controls class="msg-media"></video>`;
    else if (m.fileType?.startsWith('audio/')) body = `<audio src="${m.data}" controls class="msg-audio"></audio>`;
    else body = `<a class="msg-file" href="${m.data}" download="${esc(m.fileName)}">
      <span class="msg-file-icon">📎</span>
      <div class="msg-file-info">
        <div class="msg-file-name">${esc(m.fileName)}</div>
        <div class="msg-file-size">${fmtSize(m.fileSize||0)}</div>
      </div></a>`;
  } else if (m.type === 'voice'){
    body = `<audio src="${m.data}" controls class="msg-audio"></audio>`;
  } else {
    body = `<span class="msg-text">${esc(m.text)}</span>`;
  }

  const replyHtml = m.replyTo ? `<div class="reply-quote">
      <span class="who">${esc(m.replyTo.name)}</span>${esc(m.replyTo.text)}
    </div>` : '';

  const reactions = m.reactions || {};
  const reactHtml = Object.entries(reactions).filter(([,u])=>u.length)
    .map(([e,u]) => `<div class="reaction ${u.includes(me.uid)?'mine':''}" data-id="${m.id}" data-emoji="${e}">${e} ${u.length}</div>`).join('');

  const author = (!own && showAuthor) ? `<div class="msg-author" style="color:${m.color||'var(--accent)'}">${esc(m.name)}</div>` : '';

  const actions = own
    ? `<div class="msg-actions">
        <button data-id="${m.id}" data-act="emoji">😀</button>
        <button data-id="${m.id}" data-act="reply">↩</button>
        ${m.type==='text'?`<button data-id="${m.id}" data-act="edit">✏</button>`:''}
        <button data-id="${m.id}" data-act="delete">🗑</button>
      </div>`
    : `<div class="msg-actions">
        <button data-id="${m.id}" data-act="emoji">😀</button>
        <button data-id="${m.id}" data-act="reply">↩</button>
      </div>`;

  return `<div class="msg-row ${own?'own':'other'}" data-mid="${m.id}">
    ${actions}
    <div class="msg ${own?'own':'other'} ${read?'read':''} ${m.edited?'edited':''}">
      ${author}${replyHtml}${body}
      <span class="msg-time">${fmtTime(m.time)}</span>
      ${reactHtml?`<div class="reactions">${reactHtml}</div>`:''}
    </div></div>`;
}

/* ============ ОТПРАВКА ============ */
document.getElementById('composer').addEventListener('submit', e => {
  e.preventDefault();
  const text = messageInput.value.trim();
  if (!text || !currentChat) return;
  const msg = {
    id: 'm_' + Math.random().toString(36).slice(2,10),
    uid: me.uid, name: me.name, color: me.color,
    text, time: Date.now(), type: 'text',
    replyTo: replyTo ? { id: replyTo.id, name: replyTo.name, text: replyTo.text } : null
  };
  socket.emit('message', { room: chatKey(currentChat), msg });
  messageInput.value = '';
  sendBtn.disabled = true;
  socket.emit('typing', { room: chatKey(currentChat), isTyping: false });
  lastTyping = false;
  cancelReply();
});

messageInput.addEventListener('input', () => {
  sendBtn.disabled = !messageInput.value.trim();
  if (!currentChat) return;
  const isTyping = messageInput.value.length > 0;
  if (isTyping !== lastTyping){ lastTyping = isTyping;
    socket.emit('typing', { room: chatKey(currentChat), isTyping }); }
  clearTimeout(typingTimer);
  if (isTyping) typingTimer = setTimeout(() => {
    socket.emit('typing', { room: chatKey(currentChat), isTyping: false });
    lastTyping = false;
  }, 2500);
});

/* ============ ФАЙЛЫ ============ */
document.getElementById('fileBtn').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  if (f.size > 5*1024*1024) return showToast('Максимум 5 МБ');
  const base64 = await fileToBase64(f);
  const msg = {
    id: 'm_' + Math.random().toString(36).slice(2,10),
    uid: me.uid, name: me.name, color: me.color,
    type: 'file', data: base64,
    fileName: f.name, fileType: f.type, fileSize: f.size, time: Date.now(),
    replyTo: replyTo ? { id: replyTo.id, name: replyTo.name, text: replyTo.text } : null
  };
  socket.emit('message', { room: chatKey(currentChat), msg });
  cancelReply();
  e.target.value = '';
});
function fileToBase64(f){ return new Promise((res,rej)=>{ const r=new FileReader();
  r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); }); }

/* ============ ГОЛОС ============ */
let mediaRec = null, chunks = [];
const voiceBtn = document.getElementById('voiceBtn');
voiceBtn.onclick = async () => {
  if (mediaRec && mediaRec.state === 'recording'){ mediaRec.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRec = new MediaRecorder(stream);
    chunks = [];
    mediaRec.ondataavailable = e => chunks.push(e.data);
    mediaRec.onstop = async () => {
      voiceBtn.classList.remove('rec');
      const blob = new Blob(chunks, { type: 'audio/webm' });
      stream.getTracks().forEach(t => t.stop());
      if (blob.size < 500) return showToast('Слишком коротко');
      if (blob.size > 2*1024*1024) return showToast('Голосовое > 2 МБ');
      const base64 = await fileToBase64(new File([blob],'voice.webm',{type:'audio/webm'}));
      const msg = { id: 'm_'+Math.random().toString(36).slice(2,10),
        uid: me.uid, name: me.name, color: me.color,
        type: 'voice', data: base64, time: Date.now() };
      socket.emit('message', { room: chatKey(currentChat), msg });
    };
    mediaRec.start();
    voiceBtn.classList.add('rec');
    showToast('Запись... Нажмите ещё раз, чтобы отправить');
  } catch { showToast('Нет доступа к микрофону'); }
};

/* ============ ОТВЕТ / ЭМОДЗИ / РЕДАКТ ============ */
function startReply(id){
  const m = (state.messages[chatKey(currentChat)]||[]).find(x => x.id === id);
  if (!m) return;
  replyTo = { id: m.id, name: m.name, text: previewOf(m) };
  document.getElementById('replyPreview').innerHTML = `<div class="reply-preview">
    <span class="txt"><b style="color:var(--accent)">${esc(m.name)}:</b> ${esc(previewOf(m))}</span>
    <button onclick="cancelReply()">✕</button></div>`;
  messageInput.focus();
}
window.cancelReply = () => { replyTo = null; document.getElementById('replyPreview').innerHTML = ''; };

function showEmojiPicker(anchor, msgId){
  document.querySelectorAll('.emoji-picker').forEach(el => el.remove());
  const emojis = ['👍','❤️','😂','😮','😢','🔥','🎉','👏'];
  const p = document.createElement('div');
  p.className = 'emoji-picker';
  p.innerHTML = emojis.map(e => `<button data-e="${e}">${e}</button>`).join('');
  document.body.appendChild(p);
  const r = anchor.getBoundingClientRect();
  p.style.top = (r.top - 44) + 'px';
  p.style.left = Math.max(8, Math.min(r.left, innerWidth - 280)) + 'px';
  p.querySelectorAll('button').forEach(b => b.onclick = () => { toggleReaction(msgId, b.dataset.e); p.remove(); });
  setTimeout(() => document.addEventListener('click', function close(e){
    if (!p.contains(e.target)){ p.remove(); document.removeEventListener('click', close); }
  }), 0);
}

function toggleReaction(id, emoji){
  const arr = state.messages[chatKey(currentChat)] || [];
  const m = arr.find(x => x.id === id); if (!m) return;
  const reactions = { ...(m.reactions||{}) };
  const uids = [...(reactions[emoji]||[])];
  const i = uids.indexOf(me.uid);
  if (i > -1) uids.splice(i,1); else uids.push(me.uid);
  if (uids.length) reactions[emoji] = uids; else delete reactions[emoji];
  socket.emit('messageUpdate', { room: chatKey(currentChat), id, patch: { reactions } });
}

function editMessage(id){
  const m = (state.messages[chatKey(currentChat)]||[]).find(x => x.id === id);
  if (!m || m.type !== 'text') return;
  showModal('Редактировать', m.text, val => {
    if (val && val !== m.text)
      socket.emit('messageUpdate', { room: chatKey(currentChat), id,
        patch: { text: val, edited: true, editedAt: Date.now() } });
  });
}

function deleteMessage(id){
  if (!confirm('Удалить сообщение?')) return;
  socket.emit('messageDelete', { room: chatKey(currentChat), id });
}

function showModal(title, initial, onOk){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal"><h3>${esc(title)}</h3>
    <textarea rows="3">${esc(initial)}</textarea>
    <div class="modal-actions">
      <button class="btn-cancel">Отмена</button>
      <button class="btn-ok">OK</button>
    </div></div>`;
  document.body.appendChild(bg);
  const ta = bg.querySelector('textarea'); ta.focus(); ta.select();
  bg.querySelector('.btn-cancel').onclick = () => bg.remove();
  bg.querySelector('.btn-ok').onclick = () => { onOk(ta.value.trim()); bg.remove(); };
  bg.addEventListener('click', e => { if (e.target === bg) bg.remove(); });
}

/* ============ ПРОЧИТАНО ============ */
function markAllRead(){
  const key = chatKey(currentChat);
  const arr = state.messages[key] || [];
  arr.forEach(m => {
    if (m.uid !== me.uid && !(m.readBy||[]).includes(me.uid)){
      socket.emit('messageUpdate', { room: key, id: m.id,
        patch: { readBy: [...(m.readBy||[]), me.uid] } });
    }
  });
}

/* ============ ПРОЧЕЕ ============ */
function openViewer(src){
  const v = document.createElement('div'); v.className = 'viewer';
  v.innerHTML = `<img src="${src}">`; v.onclick = () => v.remove();
  document.body.appendChild(v);
}
document.getElementById('backBtn').onclick = () => {
  app.classList.remove('chat-open');
  if (currentChat) socket.emit('typing', { room: chatKey(currentChat), isTyping: false });
};
document.getElementById('logoutBtn').onclick = () => {
  if (!confirm('Выйти?')) return;
  LS.del('neox-me'); location.reload();
};
setInterval(() => { if (currentChat && currentChat !== 'general') renderHeader(); renderContacts(); }, 15000);
addEventListener('resize', () => { if (innerWidth >= 820 && !currentChat) openChat('general'); });
</script>
